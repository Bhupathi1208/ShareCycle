<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Item - ShareCycle</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .page-wrapper {
            min-height: 100vh;
            padding: 35px 20px;
        }

        .form-container {
            max-width: 700px;
            margin: auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .form-header p {
            color: #777;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.97);
            padding: 30px;
            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #777;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .image-upload {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            background: #fafafa;
            transition: 0.2s;
        }

        .image-upload:hover {
            border-color: #888;
        }

        .image-upload input {
            border: none;
            padding: 0;
            box-shadow: none;
            background: transparent;
        }

        .image-help {
            margin-top: 8px;
            color: #777;
            font-size: 12px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 14px;

            border-radius: 10px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;

            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .page-wrapper {
                padding: 25px 12px;
            }

            .form-card {
                padding: 22px;
            }

            .form-header h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

<div class="page-wrapper">

    <div class="form-container">

        <!-- Header -->

        <div class="form-header">

            <h1>
                Add Donation Item
            </h1>

            <p>
                Give an unused item a second life.
            </p>

        </div>


        <!-- Form -->

        <div class="form-card">

            <form
                method="POST"
                action="/add-item"
                enctype="multipart/form-data">


                <!-- Title -->

                <div class="form-group">

                    <label for="title">
                        Item Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Python Programming Book"
                        required>

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the item, its usage, condition, etc."></textarea>

                </div>


                <!-- Category -->

                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>

                        <option value="">
                            Select Category
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Clothes">
                            Clothes
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Furniture">
                            Furniture
                        </option>

                        <option value="Study Materials">
                            Study Materials
                        </option>

                        <option value="Toys">
                            Toys
                        </option>

                        <option value="Household">
                            Household
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Condition -->

                <div class="form-group">

                    <label for="condition">
                        Condition
                    </label>

                    <select
                        id="condition"
                        name="condition"
                        required>

                        <option value="">
                            Select Condition
                        </option>

                        <option value="New">
                            New
                        </option>

                        <option value="Like New">
                            Like New
                        </option>

                        <option value="Good">
                            Good
                        </option>

                        <option value="Used">
                            Used
                        </option>

                    </select>

                </div>


                <!-- Quantity -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        value="1"
                        min="1"
                        required>

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Chittoor"
                        required>

                </div>


                <!-- Image -->

                <div class="form-group">

                    <label for="image">
                        Item Image
                    </label>

                    <div class="image-upload">

                        <input
                            type="file"
                            id="image"
                            name="image"
                            accept=".jpg,.jpeg,.png,.webp">

                        <div class="image-help">
                            JPG, JPEG, PNG or WEBP
                        </div>

                    </div>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-btn">

                    Add Donation Item

                </button>

            </form>


            <a
                href="/donor/dashboard"
                class="back-link">

                ← Back to Dashboard

            </a>

        </div>

    </div>

</div>

</body>

</html>
