<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ShareCycle</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .auth-page {
            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;

            animation: heroEntrance 0.8s ease;
        }

        .auth-card {
            background: rgba(255,255,255,0.94);

            backdrop-filter: blur(15px);

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.12);

            border: 1px solid rgba(255,255,255,0.8);
        }

        .auth-logo {
            text-align: center;

            font-size: 34px;

            font-weight: bold;

            margin-bottom: 8px;

            color: #2563eb;
        }

        .auth-logo span {
            color: #16a34a;
        }

        .auth-subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 28px;
        }

        .auth-label {
            display: block;

            font-weight: 600;

            margin-top: 12px;
        }

        .auth-button {
            width: 100%;

            margin-top: 10px;

            padding: 13px;

            font-size: 16px;
        }

        .auth-footer {
            text-align: center;

            margin-top: 22px;

            color: #6b7280;
        }

        .auth-footer a {
            font-weight: bold;
        }

        .auth-icon {
            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;

            animation: floating 3s ease-in-out infinite;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #6b7280;
        }

    </style>

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-icon">
                ♻️
            </div>

            <div class="auth-logo">
                Share<span>Cycle</span>
            </div>

            <p class="auth-subtitle">
                Welcome back! Login to continue.
            </p>


            <form method="POST">

                <label class="auth-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label class="auth-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">

                    🔐 Login

                </button>

            </form>


            <div class="auth-footer">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </div>

        </div>


        <a href="/"
           class="back-home">

            ← Back to ShareCycle

        </a>

    </div>

</div>

</body>

</html>
